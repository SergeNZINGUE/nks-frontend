<div class="modal-bg" (click)="onBackdropClick()">
  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="titre() ? null : ariaLabel()"
    [attr.aria-labelledby]="titre() ? 'modal-titre' : null"
    tabindex="-1"
    #panel
    (click)="$event.stopPropagation()">
    <div class="modal__header">
      @if (titre()) {
        <h2 id="modal-titre" class="modal__titre">{{ titre() }}</h2>
      }
      <button type="button" class="modal__fermer" (click)="closed.emit()" aria-label="Fermer">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="modal__corps">
      <ng-content />
    </div>
  </div>
</div>
